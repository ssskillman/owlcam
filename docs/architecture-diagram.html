<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OwlCam architecture — one HTTPS door into a private nest camera</title>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,600;1,600&family=Poppins:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-paper:  #0b100d;
      --color-ink:    #f2ead8;
      --color-muted:  #a8ad9d;
      --color-accent: #e8a43a;
      --font-sans:  'Poppins', system-ui, sans-serif;
      --font-serif: 'Spectral', Georgia, serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Secure paved road</p>
    <h1>OwlCam: one HTTPS door into a private nest camera</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="owlcam-architecture-title owlcam-architecture-desc">
      <title id="owlcam-architecture-title">OwlCam: one HTTPS door into a private nest camera</title>
      <desc id="owlcam-architecture-desc">Architecture diagram showing a Raspberry Pi capturing owl nest video and serving it only on localhost, a Tailscale HTTPS edge as the single permitted route to viewers, a static page served separately from Firebase Hosting, and two blocked ingress attempts that stop outside the Pi.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#a8ad9d"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#e8a43a"/>
        </marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="rgba(242,234,216,0.45)"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#0b100d"/>

      <!-- ============ ZONES (drawn first) ============ -->
      <rect x="40" y="176" width="560" height="304" rx="8"
            fill="rgba(242,234,216,0.02)" stroke="rgba(242,234,216,0.10)" stroke-width="0.8"/>
      <rect x="64" y="180" width="152" height="12" rx="2" fill="#0b100d"/>
      <text x="140" y="189" fill="rgba(242,234,216,0.45)" font-size="7" font-weight="500"
            font-family="'Poppins', sans-serif" text-anchor="middle" letter-spacing="0.14em">RASPBERRY PI · PRIVATE</text>

      <rect x="640" y="176" width="208" height="304" rx="8"
            fill="rgba(242,234,216,0.02)" stroke="rgba(242,234,216,0.28)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="668" y="180" width="112" height="12" rx="2" fill="#0b100d"/>
      <text x="724" y="189" fill="rgba(242,234,216,0.45)" font-size="7" font-weight="500"
            font-family="'Poppins', sans-serif" text-anchor="middle" letter-spacing="0.14em">TAILSCALE EDGE</text>

      <rect x="976" y="176" width="264" height="304" rx="8"
            fill="rgba(242,234,216,0.02)" stroke="rgba(242,234,216,0.10)" stroke-width="0.8"/>
      <rect x="1000" y="180" width="120" height="12" rx="2" fill="#0b100d"/>
      <text x="1060" y="189" fill="rgba(242,234,216,0.45)" font-size="7" font-weight="500"
            font-family="'Poppins', sans-serif" text-anchor="middle" letter-spacing="0.14em">PUBLIC INTERNET</text>

      <!-- ============ ARROWS (before boxes) ============ -->

      <!-- sensor -> capture -->
      <line x1="192" y1="260" x2="240" y2="260" stroke="#a8ad9d" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- capture -> mediamtx -->
      <line x1="392" y1="260" x2="440" y2="260" stroke="#a8ad9d" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- mediamtx -> tailscale edge : labelled -->
      <line x1="576" y1="260" x2="664" y2="260" stroke="#a8ad9d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="588" y="240" width="64" height="12" rx="2" fill="#0b100d"/>
      <text x="620" y="249" fill="#a8ad9d" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">HLS :8888</text>

      <!-- tailscale edge -> viewer : PERMITTED INGRESS (accent) -->
      <line x1="824" y1="260" x2="1000" y2="260" stroke="#e8a43a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="868" y="240" width="88" height="12" rx="2" fill="#0b100d"/>
      <text x="912" y="249" fill="#e8a43a" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">TLS 443 · HLS</text>

      <!-- firebase -> viewer (vertical, label beside) -->
      <line x1="1108" y1="352" x2="1108" y2="304" stroke="#a8ad9d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="1052" y="322" width="44" height="12" rx="2" fill="#0b100d"/>
      <text x="1074" y="331" fill="#a8ad9d" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">PAGE</text>

      <!-- github actions -> capture : approved deploy path (dashed) -->
      <line x1="316" y1="128" x2="316" y2="216" stroke="rgba(242,234,216,0.45)" stroke-width="1"
            stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
      <rect x="326" y="154" width="84" height="12" rx="2" fill="#0b100d"/>
      <text x="368" y="163" fill="rgba(242,234,216,0.55)" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">DEPLOY · SSH</text>

      <!-- mediamtx -> logs : audit (dashed) -->
      <line x1="508" y1="304" x2="508" y2="352" stroke="rgba(242,234,216,0.45)" stroke-width="1"
            stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
      <rect x="518" y="322" width="48" height="12" rx="2" fill="#0b100d"/>
      <text x="542" y="331" fill="rgba(242,234,216,0.55)" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">AUDIT</text>

      <!-- ============ FORBIDDEN INGRESS (stop before the boundary) ============ -->

      <text x="40" y="528" fill="rgba(242,234,216,0.45)" font-size="7" font-weight="500"
            font-family="'Poppins', sans-serif" letter-spacing="0.14em">FORBIDDEN INGRESS</text>

      <line x1="192" y1="544" x2="192" y2="508" stroke="rgba(242,234,216,0.35)" stroke-width="1" stroke-dasharray="2,3"/>
      <line x1="176" y1="500" x2="208" y2="500" stroke="#cf6b4f" stroke-width="2.4"/>
      <text x="192" y="564" fill="#cf6b4f" font-size="8" font-weight="600"
            font-family="'Poppins', sans-serif" text-anchor="middle" letter-spacing="0.10em">PORT FORWARD</text>
      <text x="192" y="580" fill="rgba(242,234,216,0.45)" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle">router &#8594; :8888</text>

      <line x1="400" y1="544" x2="400" y2="508" stroke="rgba(242,234,216,0.35)" stroke-width="1" stroke-dasharray="2,3"/>
      <line x1="384" y1="500" x2="416" y2="500" stroke="#cf6b4f" stroke-width="2.4"/>
      <text x="400" y="564" fill="#cf6b4f" font-size="8" font-weight="600"
            font-family="'Poppins', sans-serif" text-anchor="middle" letter-spacing="0.10em">LAN DIRECT</text>
      <text x="400" y="580" fill="rgba(242,234,216,0.45)" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle">rtsp · rtmp · srt</text>

      <!-- ============ NODES ============ -->

      <!-- D1 · GitHub Actions (external) -->
      <rect x="240" y="72" width="152" height="56" rx="6" fill="#0b100d"/>
      <rect x="240" y="72" width="152" height="56" rx="6"
            fill="rgba(242,234,216,0.03)" stroke="rgba(242,234,216,0.30)" stroke-width="1"/>

      <text x="316" y="112" fill="#f2ead8" font-size="12" font-weight="600"
            font-family="'Poppins', sans-serif" text-anchor="middle">GitHub Actions</text>

      <!-- A1 · IMX708 sensor (input) -->
      <rect x="64" y="216" width="128" height="88" rx="6" fill="#0b100d"/>
      <rect x="64" y="216" width="128" height="88" rx="6"
            fill="rgba(168,173,157,0.10)" stroke="rgba(242,234,216,0.45)" stroke-width="1"/>
      <rect x="72" y="224" width="28" height="12" rx="2" fill="transparent"
            stroke="rgba(242,234,216,0.40)" stroke-width="0.8"/>
      <text x="86" y="233" fill="rgba(242,234,216,0.60)" font-size="7" font-weight="500"
            font-family="'Poppins', sans-serif" text-anchor="middle" letter-spacing="0.08em">CAM</text>
      <text x="128" y="266" fill="#f2ead8" font-size="12" font-weight="600"
            font-family="'Poppins', sans-serif" text-anchor="middle">IMX708</text>
      <text x="128" y="286" fill="#a8ad9d" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">4608&#215;2592</text>

      <!-- A2 · capture pipeline (backend) -->
      <rect x="240" y="216" width="152" height="88" rx="6" fill="#0b100d"/>
      <rect x="240" y="216" width="152" height="88" rx="6"
            fill="#142019" stroke="rgba(242,234,216,0.55)" stroke-width="1"/>
      <rect x="248" y="224" width="28" height="12" rx="2" fill="transparent"
            stroke="rgba(242,234,216,0.40)" stroke-width="0.8"/>
      <text x="262" y="233" fill="rgba(242,234,216,0.60)" font-size="7" font-weight="500"
            font-family="'Poppins', sans-serif" text-anchor="middle" letter-spacing="0.08em">ENC</text>
      <text x="316" y="262" fill="#f2ead8" font-size="12" font-weight="600"
            font-family="'Poppins', sans-serif" text-anchor="middle">Capture pipeline</text>
      <text x="316" y="278" fill="#a8ad9d" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">rpicam-vid &#8594; ffmpeg</text>
      <text x="316" y="292" fill="#a8ad9d" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">1080p30 · 2.5 Mbps</text>

      <!-- A3 · MediaMTX (backend) -->
      <rect x="440" y="216" width="136" height="88" rx="6" fill="#0b100d"/>
      <rect x="440" y="216" width="136" height="88" rx="6"
            fill="#142019" stroke="rgba(242,234,216,0.55)" stroke-width="1"/>
      <rect x="448" y="224" width="28" height="12" rx="2" fill="transparent"

      <text x="462" y="233" fill="rgba(242,234,216,0.60)" font-size="7" font-weight="500"

      <text x="508" y="262" fill="#f2ead8" font-size="12" font-weight="600"
            font-family="'Poppins', sans-serif" text-anchor="middle">MediaMTX</text>
      <text x="508" y="278" fill="#a8ad9d" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:8554</text>
      <text x="508" y="292" fill="#a8ad9d" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:8888</text>

      <!-- A4 · logs (store) -->
      <rect x="440" y="352" width="136" height="72" rx="6" fill="#0b100d"/>
      <rect x="440" y="352" width="136" height="72" rx="6"
            fill="rgba(242,234,216,0.05)" stroke="#a8ad9d" stroke-width="1"/>
      <rect x="448" y="360" width="28" height="12" rx="2" fill="transparent"
            stroke="rgba(242,234,216,0.40)" stroke-width="0.8"/>
      <text x="462" y="369" fill="rgba(242,234,216,0.60)" font-size="7" font-weight="500"
            font-family="'Poppins', sans-serif" text-anchor="middle" letter-spacing="0.08em">LOG</text>
      <text x="508" y="396" fill="#f2ead8" font-size="12" font-weight="600"
            font-family="'Poppins', sans-serif" text-anchor="middle">Local logs</text>
      <text x="508" y="412" fill="#a8ad9d" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">owlcam/logs</text>

      <!-- B1 · Tailscale HTTPS edge (FOCAL) -->
      <rect x="664" y="216" width="160" height="88" rx="6" fill="#0b100d"/>
      <rect x="664" y="216" width="160" height="88" rx="6"
            fill="rgba(232,164,58,0.12)" stroke="#e8a43a" stroke-width="1.2"/>
      <rect x="672" y="224" width="28" height="12" rx="2" fill="transparent"
            stroke="rgba(232,164,58,0.60)" stroke-width="0.8"/>
      <text x="686" y="233" fill="#e8a43a" font-size="7" font-weight="500"
            font-family="'Poppins', sans-serif" text-anchor="middle" letter-spacing="0.08em">TLS</text>
      <text x="744" y="262" fill="#f2ead8" font-size="12" font-weight="600"
            font-family="'Poppins', sans-serif" text-anchor="middle">Tailscale HTTPS</text>
      <text x="744" y="278" fill="#e8a43a" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">serve | funnel</text>
      <text x="744" y="292" fill="#a8ad9d" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">only open port</text>

      <!-- C1 · viewer browser (backend) -->
      <rect x="1000" y="216" width="216" height="88" rx="6" fill="#0b100d"/>
      <rect x="1000" y="216" width="216" height="88" rx="6"
            fill="#142019" stroke="rgba(242,234,216,0.55)" stroke-width="1"/>
      <rect x="1008" y="224" width="28" height="12" rx="2" fill="transparent"

      <text x="1022" y="233" fill="rgba(242,234,216,0.60)" font-size="7" font-weight="500"

      <text x="1108" y="266" fill="#f2ead8" font-size="12" font-weight="600"
            font-family="'Poppins', sans-serif" text-anchor="middle">Viewer browser</text>
      <text x="1108" y="286" fill="#a8ad9d" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">hls.js player</text>

      <!-- C2 · Firebase Hosting (external) -->
      <rect x="1000" y="352" width="216" height="72" rx="6" fill="#0b100d"/>
      <rect x="1000" y="352" width="216" height="72" rx="6"

      <text x="1108" y="412" fill="#a8ad9d" font-size="9"

      <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(242,234,216,0.10)" stroke-width="0.8"/>

  </div>
</body>
</html>
