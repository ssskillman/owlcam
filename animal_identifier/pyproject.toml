[project]
name = "owlcam-animal-identifier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
    "pillow>=10.0",
]

[project.optional-dependencies]
inference = [
    "ultralytics>=8.3,<9",
    "open-clip-torch>=2.29,<4",
    "torch>=2.2",
    "torchvision>=0.17",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["animal_identifier"]
force-include = { "animal_identifier/species.txt" = "animal_identifier/species.txt" }

[tool.pytest.ini_options]
testpaths = ["tests"]
